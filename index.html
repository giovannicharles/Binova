<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMARTBIN — Splash</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
<style>
:root{
  --green:#2ECC71;--green-dk:#22a85c;--green-pale:#e8faf1;--green-soft:#d1f5e3;
  --blue:#00D2FF;--blue-dk:#00a8cc;--blue-pale:#e0f8ff;--blue-soft:#b8eefa;
  --white:#fff;--surface:#f6f9f7;--border:#e2ece7;
  --text:#0d1f15;--text2:#3d5c4a;--text3:#7a9e8c;--text4:#b8cec5;
  --font:'Plus Jakarta Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:#d0e2d8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.pf{width:375px;min-height:812px;background:#fff;border-radius:48px;box-shadow:0 28px 64px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05);overflow:hidden;position:relative;display:flex;flex-direction:column;}
.pf-top{height:50px;background:transparent;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;flex-shrink:0;position:relative;z-index:2;}
.pf-top::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#0d1f15;border-radius:0 0 20px 20px;}
.pf-time{font-size:13px;font-weight:700;color:var(--text);position:relative;z-index:1;}
.pf-icons{display:flex;align-items:center;gap:5px;position:relative;z-index:1;}

/* SPLASH SCREEN */
.splash{
  flex:1;
  background:linear-gradient(160deg, #f0fdf6 0%, #fff 45%, #e8f8ff 100%);
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:0;padding:40px 32px 48px;
  position:relative;overflow:hidden;
}
.splash::before{
  content:'';position:absolute;
  width:380px;height:380px;border-radius:50%;
  background:radial-gradient(circle,rgba(46,204,113,.12) 0%,transparent 70%);
  top:5%;left:50%;transform:translateX(-50%);
}
.splash::after{
  content:'';position:absolute;
  width:260px;height:260px;border-radius:50%;
  background:radial-gradient(circle,rgba(0,210,255,.10) 0%,transparent 70%);
  bottom:10%;right:-30px;
}

/* Logo */
.logo-wrap{
  width:96px;height:96px;
  background:linear-gradient(135deg,var(--green),var(--blue));
  border-radius:28px;
  display:flex;align-items:center;justify-content:center;
  box-shadow:0 16px 40px rgba(46,204,113,.30);
  position:relative;z-index:1;
  margin-bottom:28px;
}
.logo-inner{position:relative;display:flex;align-items:center;justify-content:center;}
.logo-inner svg{color:#fff;}

/* Tag */
.splash-tag{
  font-size:10px;font-weight:700;letter-spacing:3px;text-transform:uppercase;
  color:var(--text3);position:relative;z-index:1;margin-bottom:10px;
}

/* Title */
.splash-title{
  font-size:32px;font-weight:800;color:var(--text);
  letter-spacing:-.8px;position:relative;z-index:1;margin-bottom:10px;
  text-align:center;
}

/* Subtitle */
.splash-sub{
  font-size:14px;color:var(--text2);text-align:center;
  max-width:240px;line-height:1.65;position:relative;z-index:1;
  margin-bottom:40px;
}

/* Pill features */
.splash-pills{
  display:flex;gap:8px;flex-wrap:wrap;justify-content:center;
  position:relative;z-index:1;margin-bottom:40px;
}
.splash-pill{
  display:flex;align-items:center;gap:5px;
  background:#fff;border:1px solid var(--border);
  border-radius:100px;padding:5px 12px;
  font-size:11px;font-weight:600;color:var(--text2);
  box-shadow:0 2px 8px rgba(0,0,0,.04);
}
.splash-pill svg{color:var(--green);}

/* CTA */
.splash-btn{
  background:linear-gradient(135deg,var(--green),#1ec464);
  color:#fff;border:none;border-radius:100px;
  width:100%;padding:16px;
  font-size:15px;font-weight:800;font-family:var(--font);
  cursor:pointer;position:relative;z-index:1;
  box-shadow:0 10px 28px rgba(46,204,113,.32);
  display:flex;align-items:center;justify-content:center;gap:8px;
  transition:all .2s;
}
.splash-login{
  font-size:13px;font-weight:600;color:var(--text3);
  position:relative;z-index:1;margin-top:16px;cursor:pointer;
  display:flex;align-items:center;gap:4px;
}
.splash-login span{color:var(--green-dk);}

/* Deco circles */
.deco-ring{
  position:absolute;border-radius:50%;border:1.5px solid;
  pointer-events:none;
}
</style>
</head>
<body>
<div class="pf">
  <!-- Status bar -->
  <div class="pf-top">
    <span class="pf-time">09:41</span>
    <div class="pf-icons">
      <svg width="15" height="11" viewBox="0 0 15 11" fill="#0d1f15"><rect x="0" y="3" width="2.5" height="8" rx="1"/><rect x="4" y="2" width="2.5" height="9" rx="1"/><rect x="8" y="1" width="2.5" height="10" rx="1"/><rect x="12" y="0" width="2.5" height="11" rx="1"/></svg>
      <svg width="15" height="11" viewBox="0 0 18 13" fill="#0d1f15"><path d="M9 2.5c3 0 5.7 1.5 7.4 3.8L18 4.6C16 1.8 12.7 0 9 0S2 1.8 0 4.6l1.6 1.7C3.3 4 6 2.5 9 2.5z"/><path d="M9 6c2 0 3.7 1 4.8 2.6L15.4 7C14 4.9 11.7 3.5 9 3.5S4 4.9 2.6 7l1.6 1.6C5.3 7 7 6 9 6z"/><circle cx="9" cy="11" r="2"/></svg>
      <svg width="23" height="11" viewBox="0 0 23 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="2" stroke="#0d1f15" stroke-width="1.2"/><rect x="21" y="3" width="2" height="5" rx="1" fill="#0d1f15"/><rect x="1.5" y="1.5" width="15" height="8" rx="1.5" fill="#0d1f15"/></svg>
    </div>
  </div>

  <!-- Splash -->
  <div class="splash">
    <!-- Deco rings -->
    <div class="deco-ring" style="width:320px;height:320px;border-color:rgba(46,204,113,.08);top:50%;left:50%;transform:translate(-50%,-50%);"></div>
    <div class="deco-ring" style="width:220px;height:220px;border-color:rgba(0,210,255,.07);top:50%;left:50%;transform:translate(-50%,-50%);"></div>

    <!-- Logo -->
    <div class="logo-wrap">
      <div class="logo-inner">
        <i data-lucide="trash-2" style="width:44px;height:44px;color:#fff;stroke-width:1.8;"></i>
      </div>
    </div>

    <span class="splash-tag">Connected Waste Solutions</span>
    <div class="splash-title">BINOVA</div>
    <div class="splash-sub">Gérez vos déchets intelligemment depuis votre smartphone.</div>

    <!-- Pills -->
    <div class="splash-pills">
      <div class="splash-pill">
        <i data-lucide="wifi" style="width:12px;height:12px;" ></i>
        IoT en temps réel
      </div>
      <div class="splash-pill">
        <i data-lucide="bell" style="width:12px;height:12px;"></i>
        Alertes push
      </div>
      <div class="splash-pill">
        <i data-lucide="map-pin" style="width:12px;height:12px;"></i>
        Géolocalisation
      </div>
    </div>

    <!-- CTA -->
    <button class="splash-btn" onclick="gotologin();">
      Commencer
      <i data-lucide="arrow-right" style="width:18px;height:18px;color:#fff;"></i>
    </button>

    <div class="splash-login">
      J'ai déjà un compte —
      <span>Se connecter</span>
    </div>
  </div>
</div>

<script>lucide.createIcons();
function gotologin() {
  window.location.href="/12-onboarding.html"
}
</script>
</body>
</html>
