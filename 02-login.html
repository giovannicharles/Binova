<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMARTBIN — Connexion</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/lucide/0.263.1/umd/lucide.min.js"></script>
<style>
:root{
  --green:#2ECC71;--green-dk:#22a85c;--green-pale:#e8faf1;--green-soft:#d1f5e3;
  --blue:#00D2FF;--blue-dk:#00a8cc;--blue-pale:#e0f8ff;
  --white:#fff;--surface:#f6f9f7;--surface2:#edf2ef;--border:#e2ece7;--border2:#cdddd5;
  --text:#0d1f15;--text2:#3d5c4a;--text3:#7a9e8c;--text4:#b8cec5;
  --danger:#FF3B30;
  --font:'Plus Jakarta Sans',sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;}
body{font-family:var(--font);background:#d0e2d8;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px;}
.pf{width:375px;min-height:812px;background:#fff;border-radius:48px;box-shadow:0 28px 64px rgba(0,0,0,.18),0 0 0 1px rgba(0,0,0,.05);overflow:hidden;display:flex;flex-direction:column;}
.pf-top{height:50px;background:transparent;display:flex;align-items:flex-end;justify-content:space-between;padding:0 26px 8px;flex-shrink:0;position:relative;z-index:2;}
.pf-top::before{content:'';position:absolute;top:0;left:50%;transform:translateX(-50%);width:120px;height:32px;background:#0d1f15;border-radius:0 0 20px 20px;}
.pf-time{font-size:13px;font-weight:700;color:var(--text);position:relative;z-index:1;}
.pf-icons{display:flex;align-items:center;gap:5px;position:relative;z-index:1;}

/* HERO */
.login-hero{
  padding:28px 24px 24px;
  background:linear-gradient(145deg,var(--green-pale),var(--blue-pale));
  text-align:center;flex-shrink:0;
}
.login-logo{
  width:54px;height:54px;
  background:linear-gradient(135deg,var(--green),var(--blue));
  border-radius:16px;
  display:flex;align-items:center;justify-content:center;
  margin:0 auto 16px;
  box-shadow:0 8px 22px rgba(46,204,113,.26);
}
.login-title{font-size:22px;font-weight:800;color:var(--text);}
.login-sub{font-size:13px;color:var(--text3);margin-top:5px;}

/* FORM */
.login-form{flex:1;padding:22px 22px 32px;display:flex;flex-direction:column;gap:14px;overflow-y:auto;}
.f-group{display:flex;flex-direction:column;gap:6px;}
.f-lbl{font-size:11px;font-weight:700;color:var(--text2);text-transform:uppercase;letter-spacing:.5px;}
.f-input-wrap{position:relative;display:flex;align-items:center;}
.f-input{
  background:var(--surface);border:1.5px solid var(--border);border-radius:12px;
  color:var(--text);font-family:var(--font);font-size:14px;
  padding:12px 14px 12px 42px;outline:none;width:100%;
  transition:border .15s;
}
.f-input:focus{border-color:var(--green);}
.f-input-icon{position:absolute;left:13px;color:var(--text4);pointer-events:none;}
.f-input-icon svg{display:block;}
.f-input-right{position:absolute;right:13px;color:var(--text4);cursor:pointer;}

.f-forgot{text-align:right;font-size:12px;font-weight:700;color:var(--green-dk);cursor:pointer;margin-top:-6px;}

.submit-btn{
  background:linear-gradient(135deg,var(--green),#1ec464);
  border:none;border-radius:100px;padding:15px;
  font-size:15px;font-weight:800;color:#fff;font-family:var(--font);
  cursor:pointer;box-shadow:0 8px 22px rgba(46,204,113,.28);
  width:100%;display:flex;align-items:center;justify-content:center;gap:8px;
}

/* DIVIDER */
.divider{display:flex;align-items:center;gap:10px;}
.divider::before,.divider::after{content:'';flex:1;height:1px;background:var(--border);}
.divider span{font-size:11px;color:var(--text3);font-weight:600;}

/* OAUTH */
.oauth-btn{
  background:#fff;border:1.5px solid var(--border);border-radius:100px;
  padding:12px;font-size:13px;font-weight:700;color:var(--text);
  font-family:var(--font);cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;
}

/* FOOTER */
.login-footer{text-align:center;font-size:12px;color:var(--text3);}
.login-footer span{color:var(--green-dk);font-weight:700;cursor:pointer;}

/* ERROR STATE example */
.f-error{font-size:11px;color:var(--danger);display:flex;align-items:center;gap:4px;margin-top:2px;}
</style>
</head>
<body>
<div class="pf">
  <div class="pf-top">
    <span class="pf-time">09:41</span>
    <div class="pf-icons">
      <svg width="15" height="11" viewBox="0 0 15 11" fill="#0d1f15"><rect x="0" y="3" width="2.5" height="8" rx="1"/><rect x="4" y="2" width="2.5" height="9" rx="1"/><rect x="8" y="1" width="2.5" height="10" rx="1"/><rect x="12" y="0" width="2.5" height="11" rx="1"/></svg>
      <svg width="23" height="11" viewBox="0 0 23 11" fill="none"><rect x=".5" y=".5" width="20" height="10" rx="2" stroke="#0d1f15" stroke-width="1.2"/><rect x="21" y="3" width="2" height="5" rx="1" fill="#0d1f15"/><rect x="1.5" y="1.5" width="15" height="8" rx="1.5" fill="#0d1f15"/></svg>
    </div>
  </div>

  <!-- Hero -->
  <div class="login-hero">
    <div class="login-logo">
      <i data-lucide="trash-2" style="width:26px;height:26px;color:#fff;stroke-width:1.8;"></i>
    </div>
    <div class="login-title">Bon retour 👋</div>
    <div class="login-sub">Connectez-vous à votre espace SMARTBIN</div>
  </div>

  <!-- Form -->
  <div class="login-form">
    <div class="f-group">
      <label class="f-lbl">Adresse email</label>
      <div class="f-input-wrap">
        <span class="f-input-icon"><i data-lucide="mail" style="width:16px;height:16px;stroke-width:1.8;"></i></span>
        <input class="f-input" type="email" placeholder="vous@email.cm" value="marie.fobasso@email.cm">
      </div>
    </div>

    <div class="f-group">
      <label class="f-lbl">Mot de passe</label>
      <div class="f-input-wrap">
        <span class="f-input-icon"><i data-lucide="lock" style="width:16px;height:16px;stroke-width:1.8;"></i></span>
        <input class="f-input" type="password" placeholder="••••••••" value="password123">
        <span class="f-input-right"><i data-lucide="eye" style="width:16px;height:16px;stroke-width:1.8;"></i></span>
      </div>
    </div>

    <div class="f-forgot">Mot de passe oublié ?</div>

    <button class="submit-btn" onclick="gotohome()">
      <i data-lucide="log-in" style="width:18px;height:18px;stroke-width:2;"></i>
      Se connecter
    </button>

    <div class="divider"><span>ou continuer avec</span></div>

    <button class="oauth-btn">
      <svg width="18" height="18" viewBox="0 0 24 24"><path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="#4285F4"/><path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"/><path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z" fill="#FBBC05"/><path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"/></svg>
      Continuer avec Google
    </button>

    <div class="login-footer">
      Pas encore de compte ? <span>Créer un compte</span>
    </div>
  </div>
</div>
<script>lucide.createIcons();

  function gotohome() {
  window.location.href="/03-home.html"
}
</script>
</body>
</html>
